<script src="vendor/gsap.min.js"></script>
<script>
const U = 6; // 1 unit viewBox = 6px
const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
window.tl = tl;

// Set awal
gsap.set(["#s2","#s3","#s4","#s5","#s6","#s7","#s8"], { clipPath: "circle(0px at 540px 1400px)" });
// Corak "1 2" dengan offset 1.02: garis tersembunyi sepenuhnya, tanpa titik hujung bulat.
const draw = sel => gsap.set(sel, { strokeDasharray: "1 2", strokeDashoffset: 1.02 });
draw(["#s1-thread","#s2-thread","#s3-rib-h","#s3-rib-v","#s7-k1","#s7-k2","#s7-k3","#s7-sign","#s8-thread","#s8-heart"]);
const textIn = (sel, at) => tl.from(sel, { y: 10, opacity: 0, duration: .45 }, at);
const reveal = (sel, x, y, at, dur = .65) =>
  tl.fromTo(sel, { clipPath: `circle(0px at ${x*U}px ${y*U}px)` },
                 { clipPath: `circle(2300px at ${x*U}px ${y*U}px)`, duration: dur, ease: "power2.in" }, at);

// 1. Soalan pembuka
tl.from("#s1-hand", { x: 120, duration: .8, ease: "power3.out" }, 0.1);
tl.to("#s1-thread", { strokeDashoffset: 0, duration: .6, ease: "none" }, 0.75);
tl.from("#s1-bead", { y: -70, opacity: 0, duration: .7, ease: "bounce.out" }, 1.15);
textIn("#s1-l1", 1.5); textIn("#s1-l2", 1.75);
tl.to("#s1-hand", { y: -3, duration: .6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.0);
tl.to("#s1-bead", { scale: 1.6, transformOrigin: "50% 50%", duration: .25, ease: "power1.in" }, 2.85);
reveal("#s2", 90, 232, 2.95);

// 2. Satu klik
tl.from("#s2-phone", { y: 60, opacity: 0, duration: .6, ease: "back.out(1.4)" }, 3.2);
textIn("#s2-l1", 3.4); textIn("#s2-l2", 3.6);
tl.to("#s2-thread", { strokeDashoffset: 0, duration: .7, ease: "power1.inOut" }, 3.6);
tl.from("#s2-bead", { scale: 0, transformOrigin: "50% 50%", duration: .2 }, 4.25);
tl.to("#s2-btn", { scale: .9, transformOrigin: "50% 50%", duration: .12, yoyo: true, repeat: 1, ease: "power1.inOut" }, 4.6);
tl.fromTo("#s2-ripple", { scale: .6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 2.6, opacity: .9, duration: .1 }, 4.62);
tl.to("#s2-ripple", { opacity: 0, scale: 3.4, duration: .6 }, 4.72);
tl.to("#s2-bead", { scale: 1.8, duration: .25, ease: "power1.in" }, 5.85);
reveal("#s3", 125, 231, 5.95);

// 3. Jadi pek makanan
tl.from("#s3-box", { y: 120, duration: .6, ease: "back.out(1.2)" }, 6.2);
tl.from("#s3-item1", { y: -220, duration: .55, ease: "bounce.out" }, 6.7);
tl.from("#s3-item2", { y: -220, duration: .55, ease: "bounce.out" }, 7.05);
tl.from("#s3-item3", { y: -220, duration: .55, ease: "bounce.out" }, 7.4);
tl.to("#s3-rib-h", { strokeDashoffset: 0, duration: .35, ease: "none" }, 7.9);
tl.to("#s3-rib-v", { strokeDashoffset: 0, duration: .3, ease: "none" }, 8.15);
tl.from("#s3-bow", { scale: 0, transformOrigin: "50% 100%", duration: .5, ease: "back.out(3)" }, 8.4);
tl.from("#s3-l1", { scale: .3, opacity: 0, transformOrigin: "50% 70%", duration: .55, ease: "back.out(2.2)" }, 8.5);
textIn("#s3-l2", 8.8);
tl.to(["#s3-box","#s3-item1","#s3-item2","#s3-item3"], { y: -8, duration: .2, yoyo: true, repeat: 1, ease: "power1.out" }, 9.3);
reveal("#s4", 90, 196, 9.75);

// 4. Dalam perjalanan
tl.from("#s4-sun", { y: 40, duration: 3.6, ease: "sine.out" }, 10.0);
tl.to("#s4-houses", { x: -200, duration: 4.4, ease: "none" }, 9.8);
tl.to("#s4-dash", { attr: { "stroke-dashoffset": 96 }, duration: 4.4, ease: "none" }, 9.8);
tl.from("#s4-van", { x: -160, duration: .8, ease: "power3.out" }, 10.1);
