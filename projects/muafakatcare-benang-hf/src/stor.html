  <script>
    (function () {
      const T0 = 3.9, A = t => t - T0, U = 6;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      const later = v => Object.assign({ immediateRender: false }, v);

      tl.fromTo(["#st-lamp", "#st-box"], { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .5, stagger: .1 }, A(3.95));
      tl.fromTo("#st-cap", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: .5 }, A(4.5));

      // Jari gergasi: rehat (40,140) → tiga tekanan
      const P = { rest: [760, 2300], t1: [292, 636], t2: [640, 664], t3: [540, 1062] };
      const move = (from, to, t, ease = "power3.out", d = .45) =>
        tl.fromTo("#st-finger", { x: from[0], y: from[1] }, (t === A(4.4) ? (v => v) : later)({ x: to[0], y: to[1], duration: d, ease }), t);
      const press = (p, t) => tl.fromTo("#st-finger", { y: p[1] }, later({ y: p[1] + 22, duration: .1, yoyo: true, repeat: 1, ease: "power1.inOut" }), t);
      move(P.rest, P.t1, A(4.4)); press(P.t1, A(4.85));
      move(P.t1, P.t2, A(5.7)); press(P.t2, A(6.15));
      move(P.t2, P.t3, A(7.0)); press(P.t3, A(7.45));
      move(P.t3, P.rest, A(7.65), "power2.in", .5);

      // Barang muncul di rak; dinding bertukar warna pada setiap tekanan
      ["#st-i1", "#st-i2"].forEach((s, i) => tl.fromTo(s, { scale: 0, x: 0, y: 0, opacity: 1, transformOrigin: "50% 100%" }, { scale: 1, duration: .45, ease: "back.out(2.4)" }, A(4.95 + i * .12)));
      ["#st-i3", "#st-i4", "#st-i5"].forEach((s, i) => tl.fromTo(s, { scale: 0, x: 0, y: 0, opacity: 1, transformOrigin: "50% 100%" }, { scale: 1, duration: .45, ease: "back.out(2.4)" }, A(6.25 + i * .1)));
      // Tatabahasa rujukan: tekanan jari membanjirkan warna dari titik tekan (saat 15–16),
      // dan dinding baharu masuk dengan sisi tegak yang meluncur (saat 9–11)
      tl.fromTo("#st-flood", { attr: { r: 0 } }, { attr: { r: 380 }, duration: .55, ease: "power2.out" }, A(4.95));
      tl.fromTo("#st-wipe", { x: 180 }, { x: 0, duration: .36, ease: "power3.inOut" }, A(6.2));

      // Barang terbang masuk kotak, penutup ditutup, reben diikat
      [["#st-i1", 48], ["#st-i2", 71], ["#st-i3", 91], ["#st-i4", 115], ["#st-i5", 139]].forEach(([s, x], i) => {
        tl.fromTo(s, { x: 0, y: 0, scale: 1 }, later({ x: 90 - x, y: 66, scale: .35, duration: .45, ease: "power2.in" }), A(7.5 + i * .06));
        tl.fromTo(s, { opacity: 1 }, later({ opacity: 0, duration: .05 }), A(7.95 + i * .06));
      });
      tl.fromTo("#st-flapL", { rotation: -120, transformOrigin: "0% 100%" }, { rotation: 0, duration: .35, ease: "back.out(1.6)" }, A(8.15));
      tl.fromTo("#st-flapR", { rotation: 120, transformOrigin: "100% 100%" }, { rotation: 0, duration: .35, ease: "back.out(1.6)" }, A(8.15));
      tl.fromTo("#st-rh", { strokeDasharray: "1 2", strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: .25, ease: "none" }, A(8.45));
      tl.fromTo("#st-rv", { strokeDasharray: "1 2", strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: .2, ease: "none" }, A(8.6));
      tl.fromTo("#st-bow", { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: .4, ease: "back.out(3)" }, A(8.75));
      tl.fromTo("#st-box", { y: 0 }, later({ y: -6, duration: .18, yoyo: true, repeat: 1 }), A(8.95));

      // Keluar: zum ke kotak
      tl.fromTo("#st-cap", { y: 0, opacity: 1 }, later({ y: -24, opacity: 0, duration: .35, ease: "power2.in" }), A(9.05));
      tl.fromTo("#st-svg", { scale: 1, transformOrigin: `${90 * U}px ${192 * U}px` }, { scale: 3.2, duration: .6, ease: "power2.in" }, A(9.1));

      window.__timelines["stor"] = tl;
    })();
