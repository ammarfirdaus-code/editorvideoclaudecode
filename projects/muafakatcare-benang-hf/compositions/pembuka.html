  <script>
    (function () {
      const T0 = 0, A = t => t - T0;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      const later = v => Object.assign({ immediateRender: false }, v);
      document.fonts.ready.then(() => {
        // Ukur kedudukan huruf sekali, sebelum membina tween
        const word = document.getElementById("pb-word");
        const letters = [...word.querySelectorAll("span")];
        const bars = [...document.querySelectorAll(".pb-bar")];
        letters.forEach((l, i) => { bars[i].style.left = (word.offsetLeft + l.offsetLeft + l.offsetWidth / 2 - 15) + "px"; });

        // Logo dibina daripada batang yang jatuh
        bars.forEach((b, i) => {
          tl.fromTo(b, { y: -1100, scaleX: 1, opacity: 1 }, { y: 0, duration: .5, ease: "power3.in" }, A(.05 + i * .07));
          tl.fromTo(b, { scaleX: 1, opacity: 1 }, later({ scaleX: 3.2, opacity: 0, duration: .22, ease: "power1.out" }), A(.55 + i * .07));
          tl.fromTo(letters[i], { opacity: 0, y: 0, scaleY: .6, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: .28 }, A(.55 + i * .07));
        });
        tl.fromTo("#pb-dash", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: .35 }, A(1.15));
        tl.fromTo("#pb-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .6 }, A(1.25));

        // Tangan menyambut manik pada tali
        tl.fromTo("#pb-thread", { strokeDasharray: "1 2", strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: .45, ease: "none" }, A(.9));
        tl.fromTo("#pb-bead", { y: -120 }, { y: 0, duration: .55, ease: "bounce.out" }, A(1.15));
        tl.fromTo("#pb-hand", { x: 1500, y: 640 }, { x: 760, duration: .8, ease: "power3.out" }, A(1.0));
        tl.fromTo("#pb-hand", { y: 640 }, later({ y: 624, duration: .25, yoyo: true, repeat: 1, ease: "sine.inOut" }), A(1.75));
        tl.fromTo("#pb-bead", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.35, duration: .12, yoyo: true, repeat: 1 }, A(1.85));

        // Keluar: huruf jatuh, jalur warna menyapu ke atas
        tl.fromTo("#pb-cap", { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: .35, ease: "power2.in" }, A(3.15));
        tl.fromTo(letters, { y: 0 }, later({ y: 140, opacity: 0, duration: .35, stagger: .03, ease: "power2.in" }), A(3.1));
        tl.fromTo(["#pb-tag", "#pb-dash"], { opacity: 1 }, later({ opacity: 0, duration: .25 }), A(3.1));
        ["#pb-w1", "#pb-w2", "#pb-w3", "#pb-w4"].forEach((w, i) =>
          tl.fromTo(w, { y: 1920 }, { y: 0, duration: .42, ease: "power3.inOut" }, A(3.25 + i * .07)));

        window.__timelines["pembuka"] = tl;
      });
    })();
  </script>
