      <img class="st-it" id="st-i2" src="assets/img/item-gula.webp" alt="" style="left:410px; top:760px; width:184px; height:240px" />

      <img class="st-it" id="st-i4" src="assets/img/item-tin.webp" alt="" style="left:790px; top:800px; width:163px; height:200px" />
      <!-- Kotak di atas meja (permukaan meja y≈1328) -->
      <img class="st-it" id="st-open" src="assets/img/kotak-buka.webp" alt="" style="left:322px; top:1006px; width:436px; height:322px" />
      <img class="st-it" id="st-closed" src="assets/img/kotak-tutup.webp" alt="" style="left:335px; top:994px; width:410px; height:334px" />
      </div>
      <div id="st-finger" style="position:absolute;left:0;top:0;width:0;height:0"><img src="assets/img/tangan-tuding.webp" alt="" style="position:absolute;left:-0.52px;top:-63.440000000000005px;width:774.8000000000001px;height:271.96000000000004px;max-width:none"></div>
      <div id="st-cap"><b>RM50</b><small>= 1 pek makanan asas</small></div>

  <script>
    (function () {
      const T0 = 3.9, A = t => t - T0;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      const later = v => Object.assign({ immediateRender: false }, v);

      tl.fromTo("#st-scene", { scale: 1.06, transformOrigin: "50% 60%" }, { scale: 1, duration: 5.2, ease: "sine.out" }, A(3.9));
      tl.fromTo(["#st-open"], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .5 }, A(3.95));
      tl.fromTo("#st-cap", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: .5 }, A(4.5));

      // Jari gergasi dari bawah (tuding atas): rehat → tiga tekanan. Kedudukan = hujung jari.
      const P = { rest: [700, 2350], t1: [266, 870], t2: [688, 880], t3: [540, 1130] };
      tl.fromTo("#st-finger", { x: P.rest[0], y: P.rest[1], rotation: 90 }, { x: P.t1[0], y: P.t1[1], duration: .45, ease: "power3.out" }, A(4.4));
      const press = (p, t) => tl.fromTo("#st-finger", { y: p[1] }, later({ y: p[1] + 22, duration: .1, yoyo: true, repeat: 1, ease: "power1.inOut" }), t);
      const move = (a, b, t, ease = "power3.out", d = .45) => tl.fromTo("#st-finger", { x: a[0], y: a[1] }, later({ x: b[0], y: b[1], duration: d, ease }), t);
      press(P.t1, A(4.85)); move(P.t1, P.t2, A(5.7)); press(P.t2, A(6.15)); move(P.t2, P.t3, A(7.0)); press(P.t3, A(7.45));
      move(P.t3, P.rest, A(7.65), "power2.in", .5);

      // Tekanan 1: warna banjir dari hujung jari; barang pertama muncul
      tl.fromTo("#st-flood", { clipPath: "circle(0px at 266px 870px)" }, { clipPath: "circle(2300px at 266px 870px)", duration: .6, ease: "power2.out" }, A(4.95));
      ["#st-i1", "#st-i2"].forEach((s, i) => tl.fromTo(s, { scale: 0, x: 0, y: 0, opacity: 1, transformOrigin: "50% 100%" }, { scale: 1, duration: .45, ease: "back.out(2.2)" }, A(4.95 + i * .12)));
      // Tekanan 2: dinding baharu masuk dengan sisi tegak yang meluncur; barang lain muncul
      tl.fromTo("#st-wipe", { x: 1080 }, { x: 0, duration: .36, ease: "power3.inOut" }, A(6.2));
      ["#st-i3", "#st-i4"].forEach((s, i) => tl.fromTo(s, { scale: 0, x: 0, y: 0, opacity: 1, transformOrigin: "50% 100%" }, { scale: 1, duration: .45, ease: "back.out(2.2)" }, A(6.25 + i * .12)));

      // Tekanan 3: barang terbang masuk kotak, kotak ditutup (kotak terbuka → kotak berreben)
      [["#st-i1", 266, 845], ["#st-i2", 502, 880], ["#st-i3", 688, 860], ["#st-i4", 871, 900]].forEach(([s, x, y], i) => {
        tl.fromTo(s, { x: 0, y: 0, scale: 1 }, later({ x: 540 - x, y: 1120 - y, scale: .3, duration: .45, ease: "power2.in" }), A(7.5 + i * .07));
        tl.fromTo(s, { opacity: 1 }, later({ opacity: 0, duration: .05 }), A(7.95 + i * .07));
      });
      tl.fromTo("#st-closed", { opacity: 0, scaleY: 1.12, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: .3, ease: "back.out(2.5)" }, A(8.2));
      tl.fromTo("#st-open", { opacity: 1 }, later({ opacity: 0, duration: .08 }), A(8.22));
      tl.fromTo("#st-closed", { y: 0 }, later({ y: -16, duration: .16, yoyo: true, repeat: 1 }), A(8.85));

      // Keluar: zum ke kotak
      tl.fromTo("#st-cap", { y: 0, opacity: 1 }, later({ y: -24, opacity: 0, duration: .35, ease: "power2.in" }), A(9.05));
      tl.fromTo("#st-wrap", { scale: 1, transformOrigin: "540px 1170px" }, { scale: 3.2, duration: .6, ease: "power2.in" }, A(9.1));

      window.__timelines["stor"] = tl;
    })();
  </script>
