<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #hd-wrap { position: absolute; inset: 0; overflow: hidden;
               background: radial-gradient(circle at 50% 50%, #E0283F 0, #C5162E 55%, #9E0F23 100%); }
    #hd-panel { position: absolute; inset: 0; overflow: hidden; }
    #hd-panel > svg:first-child { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #hd-head { position: absolute; left: 0; right: 0; top: 0; height: 230px; background: #1E1A68; color: #fff;
               display: flex; align-items: center; justify-content: center; gap: 28px; font: 700 86px Poppins, sans-serif; }
    #hd-head i { width: 62px; height: 62px; border-radius: 50%; background: #2FA36B; display: inline-block; position: relative; }
    #hd-head i::after { content: ""; position: absolute; left: 17px; top: 9px; width: 18px; height: 32px;
                        border: solid #fff; border-width: 0 9px 9px 0; transform: rotate(45deg); }
    #hd-doorbg { position: absolute; left: -100px; top: 0; width: 1280px; height: 1920px; }
    #hd-rect { position: absolute; left: 224px; top: 410px; width: 596px; height: 1060px; overflow: hidden; }
    #hd-rect i { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; }
    #hd-plate { position: absolute; left: 220px; top: 740px; width: 640px; height: 657px; }
    #hd-hl { position: absolute; left: 26px; top: 1500px; width: 1029px; height: 530px; }
    #hd-logo { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 40%, #FFFFFF 0, #F5F6FA 100%); }
    #hd-logo img { position: absolute; left: 240px; top: 330px; width: 600px; height: 424px; }
    #hd-hands { position: absolute; inset: 0; pointer-events: none; }
    .hd-cap { position: absolute; left: 60px; right: 60px; top: 330px; text-align: center; font-family: Poppins, sans-serif;
              color: #fff; text-shadow: 0 4px 24px rgba(15,18,53,.25); }
    .hd-cap b { display: block; font-weight: 800; font-size: 84px; line-height: 1.08; letter-spacing: -1px; }
    .hd-cap small { display: block; font-weight: 600; font-size: 46px; line-height: 1.3; }
  </style>
  <div id="root" data-composition-id="hidangan" data-width="1080" data-height="1920">
    <div id="hd-wrap">
      <div id="hd-panel">
        <svg viewBox="0 0 180 320">
          <rect width="180" height="320" fill="#2FA36B" /><rect width="180" height="320" fill="url(#glow)" />
          <g id="hd-steam" transform="translate(0 -30)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
            <path d="M78 150 Q74 142 78 134 Q82 126 78 118" /><path d="M90 146 Q86 138 90 130 Q94 122 90 114" /><path d="M102 150 Q98 142 102 134 Q106 126 102 118" />
          </g>
          <g id="hd-cup" filter="url(#sh)"><circle cx="40" cy="256" r="14" fill="#FFFFFF" /><circle cx="40" cy="256" r="10.5" fill="#C98A4B" /></g>
        </svg>
        {{P.pinggan()}}
        <div id="hd-head"><i></i>Papan Impak</div>
        {{P.bgPintu("hd-doorbg")}}
        <div id="hd-rect">{{P.bgPintu("", "position:absolute;left:-324px;top:-410px;width:1280px;height:1920px")}}<i></i></div>
      </div>
      <div id="hd-logo"><img src="assets/logo.png" alt="Muafakat Care" /></div>
      <div id="hd-hands"><div id="hd-hg">{{P.tanganKad()}}</div></div>
      <div class="hd-cap" id="hd-cap1"><b>{{P.words("Setiap bulan")}}</b><small>{{P.words("Infak ikut kemampuan")}}</small><small style="font-weight:700;color:#FFE7A8">{{P.words("RM10 pun diterima")}}</small></div>
      <div class="hd-cap" id="hd-cap2"><b>{{P.words("Setiap agihan")}}</b><b>{{P.words("direkod")}}</b></div>
    </div>
  </div>
  <script>
    (function () {
      const T0 = 22.35, A = t => t - T0;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      const later = v => Object.assign({ immediateRender: false }, v);

      // Masuk (tatabahasa rujukan saat 46–48): ambang pintu gelap kekal, dinding bertukar hijau,
      // segi empat itu mengecil, berpusing dan menjadi pinggan
      tl.fromTo("#hd-doorbg", { opacity: 1 }, { opacity: 0, duration: .4, ease: "power1.inOut" }, A(22.45));
      tl.fromTo("#hd-rect", { scaleX: 1, scaleY: 1, x: 0, y: 0, borderRadius: "0%", transformOrigin: "50% 50%" },
        { scaleX: 1.007, scaleY: .566, x: 18, y: 128, borderRadius: "50%", duration: .5, ease: "power2.inOut" }, A(22.8));
      tl.fromTo("#hd-rect i", { opacity: 0 }, { opacity: 1, duration: .4, ease: "power1.in" }, A(22.85));
      tl.fromTo("#hd-rect", { rotation: 0 }, later({ rotation: 28, duration: .25, ease: "power1.out" }), A(22.8));
      tl.fromTo("#hd-rect", { rotation: 28 }, later({ rotation: 0, duration: .25, ease: "power1.in" }), A(23.05));
      tl.fromTo("#hd-rect", { opacity: 1 }, later({ opacity: 0, duration: .15 }), A(23.32));

      // Syot dari atas: pinggan diletak, tangan beredar, wap naik
      tl.fromTo("#hd-plate", { opacity: 0, scale: .97, transformOrigin: "50% 55%" }, { opacity: 1, scale: 1, duration: .2 }, A(23.25));
      tl.fromTo("#hd-cup", { opacity: 0 }, { opacity: 1, duration: .25 }, A(23.3));
            tl.fromTo("#hd-steam", { opacity: 0 }, { opacity: .8, duration: .4 }, A(23.6));
      tl.fromTo("#hd-steam path", { y: 6 }, { y: -10, duration: 1.3, ease: "sine.inOut", stagger: .2 }, A(23.6));
      tl.fromTo("#hd-cap1 .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: .13, stagger: .067, ease: "expo.out" }, A(23.4));
      tl.fromTo("#hd-cap1 .w", { opacity: 1, filter: "blur(0px)" }, later({ opacity: 0, filter: "blur(8px)", duration: .16, stagger: .025, ease: "power2.in" }), A(24.55));

      // Babak mengecil menjadi kad Papan Impak, dipegang dua tangan
      tl.fromTo("#hd-panel", { scale: 1, y: 0, borderRadius: 0, boxShadow: "0 0 0 rgba(15,18,53,0)", opacity: 1 },
        { scale: .5, y: 160, borderRadius: 60, boxShadow: "0 40px 90px rgba(15,18,53,.45)", duration: .6, ease: "power3.inOut" }, A(24.8));
      tl.fromTo("#hd-head", { opacity: 0 }, { opacity: 1, duration: .3 }, A(25.25));
      tl.fromTo("#hd-hl", { y: 700 }, { y: 0, duration: .6, ease: "power3.out" }, A(25.2));
      tl.fromTo("#hd-panel", { y: 160 }, later({ y: 120, duration: 1.2, ease: "sine.inOut" }), A(25.9));
      tl.fromTo("#hd-hg", { y: 0 }, { y: -40, duration: 1.2, ease: "sine.inOut" }, A(25.9));
      tl.fromTo("#hd-cap2 .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: .13, stagger: .067, ease: "expo.out" }, A(25.3));
      tl.fromTo("#hd-cap2 .w", { opacity: 1, filter: "blur(0px)" }, later({ opacity: 0, filter: "blur(8px)", duration: .18, stagger: .04, ease: "power2.in" }), A(26.55));

      // Keluar (tatabahasa rujukan saat 52–53): kad berpusing 3D, mendedahkan muka logo di sebelahnya,
      // kemudian muka logo membesar menjadi babak penutup
      tl.fromTo("#hd-panel", { rotationY: 0, transformPerspective: 2400 }, { rotationY: 90, duration: .18, ease: "power2.in" }, A(26.7));
      tl.fromTo("#hd-logo", { rotationY: -90, scale: .5, y: 120, borderRadius: 60, transformPerspective: 2400 },
        { rotationY: 0, duration: .18, ease: "power2.out" }, A(26.88));
      tl.fromTo("#hd-logo", { scale: .5, y: 120, borderRadius: 60 }, later({ scale: 1, y: 0, borderRadius: 0, duration: .35, ease: "power2.inOut" }), A(27.05));
      tl.fromTo("#hd-hg", { y: -40 }, later({ y: 700, duration: .4, ease: "power2.in" }), A(26.95));

      window.__timelines["hidangan"] = tl;
    })();
  </script>
</template>
